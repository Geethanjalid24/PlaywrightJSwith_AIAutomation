name: AI Employee Lifecycle E2E Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test

      - name: Upload HTML report (with video + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report
          retention-days: 14

      - name: Upload raw evidence (screenshots, self-healing log, timing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            reports/screenshots
            reports/self-healing
            reports/results
          retention-days: 14
